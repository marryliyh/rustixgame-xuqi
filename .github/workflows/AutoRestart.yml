name: Rustix Auto Restart via VPS SSH Password

on:
  schedule:
    - cron: '22 */2 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SSH password client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client sshpass curl

      - name: Start VPS SSH SOCKS5 tunnel
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" || { echo "SSH_HOST 未配置"; exit 1; }
          test -n "$SSH_USER" || { echo "SSH_USER 未配置"; exit 1; }
          test -n "$SSH_PASSWORD" || { echo "SSH_PASSWORD 未配置"; exit 1; }
          SSH_PORT="${SSH_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null || {
            echo "无法连接 VPS SSH 端口，请检查 SSH_HOST 和 SSH_PORT"
            exit 1
          }
          chmod 600 ~/.ssh/known_hosts

          SSHPASS="$SSH_PASSWORD" sshpass -e ssh \
            -p "$SSH_PORT" \
            -N -D 127.0.0.1:10808 \
            -o PreferredAuthentications=password,keyboard-interactive \
            -o PubkeyAuthentication=no \
            -o BatchMode=no \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "$SSH_USER@$SSH_HOST" \
            > ssh_tunnel.log 2>&1 &

          echo $! > ssh_tunnel.pid
          sleep 6
          if ! kill -0 "$(cat ssh_tunnel.pid)" 2>/dev/null; then
            echo "SSH 密码登录或隧道启动失败"
            cat ssh_tunnel.log || true
            exit 1
          fi

          timeout 3 bash -c '</dev/tcp/127.0.0.1/10808' || {
            echo "本地 SOCKS5 端口 10808 未监听"
            cat ssh_tunnel.log || true
            exit 1
          }
          echo "SSH 密码登录成功，SOCKS5 隧道已启动：127.0.0.1:10808"

      - name: Verify VPS exit and Rustix access
        run: |
          set -euo pipefail
          echo "===== VPS 出口 IP ====="
          curl --socks5-hostname 127.0.0.1:10808 \
            --connect-timeout 15 --max-time 30 \
            -fsS https://api.ipify.org | tee vps_exit_ip.txt
          echo

          echo "===== Rustix HTTPS 预检 ====="
          curl --socks5-hostname 127.0.0.1:10808 \
            --connect-timeout 20 --max-time 40 \
            -sS -D rustix_headers.txt -o rustix_probe.html \
            https://my.rustix.me/ || {
              echo "通过 VPS 访问 Rustix 失败"
              cat ssh_tunnel.log || true
              exit 1
            }
          head -n 20 rustix_headers.txt || true

      - name: Install Playwright Chromium
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Rustix automation through VPS
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          PROXY_URL: socks5://127.0.0.1:10808
        run: python rustix.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustix-vps-password-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            *.png
            *.html
            *.txt
            ssh_tunnel.log

      - name: Delete old workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
