name: Rustix Auto Restart

on:
  schedule:
    - cron: '22 */2 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 解析节点并启动 sing-box 混合代理
      - name: Parse Node Link & Start Proxy
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "❌ 错误: 未在仓库 Secrets 配置 NODE_LINK！"
            exit 1
          else
            echo "📥 下载 sing-box 内核..."
            curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.9.3/sing-box-1.9.3-linux-amd64.tar.gz | tar -xz
            mv sing-box-*/sing-box ./sing-box
            chmod +x ./sing-box

            echo "⚡ 解析节点链接..."
            python parse_node.py

            echo "🚀 启动后台代理 (127.0.0.1:10809)..."
            ./sing-box run -c config.json > singbox.log 2>&1 &
            sleep 5
            
            echo "📊 --- sing-box 启动日志 ---"
            cat singbox.log || true
            echo "---------------------------"

            echo "🌐 测试节点代理连通性："
            curl -x http://127.0.0.1:10809 -s https://api.ipify.org || echo "⚠️ 代理端口尚未成功建立连接"
            echo ""
          fi

      # 💡 关键修复：强制下载 Chromium 内核及 Linux 系统底层依赖
      - name: Install dependencies & Chromium Browser
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install playwright requests
          playwright install --with-deps chromium

      # 运行主自动化脚本
      - name: Run script with Xvfb
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          PROXY_URL: http://127.0.0.1:10809
        run: xvfb-run --auto-servernum python rustix.py

      # 上传截图与日志
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-artifacts
          path: |
            *.png
            singbox.log

      # 清理历史运行记录
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
