name: Rustix Auto Restart

on:
  schedule:
    - cron: '22 */2 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🚀 自动解析节点链接并启动 sing-box 本地 SOCKS5 代理
      - name: Parse Node Link & Start Proxy
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "⚠️ 未配置 NODE_LINK Secrets，跳过代理启动。"
          else
            echo "📥 正在下载 sing-box 内核..."
            curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.9.3/sing-box-1.9.3-linux-amd64.tar.gz | tar -xz
            mv sing-box-*/sing-box ./sing-box

            echo "⚡ 正在解析节点链接..."
            python parse_node.py

            echo "🚀 启动后台代理 (127.0.0.1:10808)..."
            ./sing-box run -c config.json &
            sleep 4
            
            echo "🌐 测试节点代理连通性与出口 IP："
            curl -x socks5://127.0.0.1:10808 -s https://api.ipify.org || true
            echo ""
          fi

      # 安装依赖
      - name: Install dependencies & Xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install playwright requests
          playwright install chromium

      # 运行主自动化脚本
      - name: Run script with Xvfb
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          PROXY_URL: socks5://127.0.0.1:10808
        run: xvfb-run --auto-servernum python rustix.py

      # 上传截图产物
      - name: Upload Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-screenshots
          path: '*.png'

      # 清理历史运行记录
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
