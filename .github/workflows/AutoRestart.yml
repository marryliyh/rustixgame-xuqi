name: Rustix Auto Restart

on:
  schedule:
    - cron: '22 */2 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sing-box and start proxy
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          set -euo pipefail
          test -n "$NODE_LINK" || { echo "NODE_LINK 未配置"; exit 1; }
          curl -fL --retry 3 -o sing-box.tar.gz             https://github.com/SagerNet/sing-box/releases/download/v1.9.3/sing-box-1.9.3-linux-amd64.tar.gz
          tar -xzf sing-box.tar.gz
          mv sing-box-*/sing-box ./sing-box
          chmod +x ./sing-box
          python parse_node.py
          ./sing-box check -c config.json
          nohup ./sing-box run -c config.json > singbox.log 2>&1 &
          echo $! > singbox.pid
          sleep 8
          kill -0 "$(cat singbox.pid)" || { cat singbox.log; exit 1; }
          cat singbox.log || true

      - name: Verify proxy path
        run: |
          set -o pipefail
          echo "===== 出口 IP ====="
          curl --socks5-hostname 127.0.0.1:10808 --connect-timeout 15 --max-time 30             -fsS https://api.ipify.org && echo
          echo "===== Rustix HTTPS ====="
          curl --socks5-hostname 127.0.0.1:10808 --connect-timeout 20 --max-time 40             -sS -D rustix_headers.txt -o rustix_probe.html https://my.rustix.me/ || {
              echo "Rustix HTTPS 预检失败";
              cat singbox.log || true;
              exit 1;
            }
          head -n 20 rustix_headers.txt || true

      - name: Install Playwright Chromium
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Rustix automation
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          PROXY_URL: socks5://127.0.0.1:10808
        run: python rustix.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustix-run-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            *.png
            *.html
            *.txt
            singbox.log
            config.json

      - name: Delete old workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
