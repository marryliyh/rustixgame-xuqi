name: Rustix Auto Restart

on:
  schedule:
    # 每两小时运行一次
    - cron: '22 */2 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 安装 Xvfb (虚拟显示) 
      - name: Install dependencies & Xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install playwright requests
          playwright install chromium

      # 通过 xvfb-run 以有头模式 (GUI) 运行 Python 脚本
      - name: Run script with Xvfb
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          # 💡 如果 GitHub 默认 IP 也被拦，可以取消下一行的注释并在 Secret 配置你自己的 SOCKS5/HTTP 代理
          # PROXY_URL: ${{ secrets.PROXY_URL }}
        run: xvfb-run --auto-servernum python rustix.py

      # 上传截图供排查
      - name: Upload Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-screenshots
          path: '*.png'

      # 自动清理历史 Action 记录，只留最后 1 条
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
