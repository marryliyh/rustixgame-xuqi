name: Rustix Auto Restart

on:
  schedule:
    - cron: '22 */2 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🚀 自动解析节点链接 (vless/trojan/vmess/hy2) 并启动 sing-box
      - name: Parse Node Link & Start Proxy
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "⚠️ 未配置 NODE_LINK Secrets，使用直连模式。"
          else
            echo "📥 下载 sing-box 代理内核..."
            curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.9.3/sing-box-1.9.3-linux-amd64.tar.gz | tar -xz
            mv sing-box-*/sing-box ./sing-box

            echo "⚡ 正在解析节点链接并生成代理配置..."
            python3 -c '
import os, sys, json, base64
from urllib.parse import urlparse, parse_qs, unquote

node_url = os.environ.get("NODE_LINK", "").strip()
if not node_url:
    sys.exit(0)

outbound = {}
if node_url.startswith("vless://"):
    u = urlparse(node_url)
    q = parse_qs(u.query)
    uuid = u.username
    host = u.hostname
    port = u.port or 443
    sni = q.get("sni", [q.get("host", [host])[0]])[0]
    sec = q.get("security", ["none"])[0]
    net_type = q.get("type", ["tcp"])[0]
    path = q.get("path", ["/"])[0]
    ws_host = q.get("host", [sni])[0]
    insecure = q.get("insecure", q.get("allowInsecure", ["0"]))[0] in ["1", "true"]

    outbound = {
        "type": "vless", "tag": "proxy", "server": host, "server_port": int(port), "uuid": uuid
    }
    if sec in ["tls", "reality"]:
        outbound["tls"] = {"enabled": True, "server_name": sni, "insecure": insecure}
        if sec == "reality":
            outbound["tls"]["reality"] = {
                "enabled": True,
                "public_key": q.get("pbk", [""])[0],
                "short_id": q.get("sid", [""])[0]
            }
    if net_type == "ws":
        outbound["transport"] = {"type": "ws", "path": unquote(path), "headers": {"Host": ws_host}}

elif node_url.startswith("trojan://"):
    u = urlparse(node_url)
    q = parse_qs(u.query)
    pwd = u.username
    host = u.hostname
    port = u.port or 443
    sni = q.get("sni", [q.get("host", [host])[0]])[0]
    net_type = q.get("type", ["tcp"])[0]
    path = q.get("path", ["/"])[0]
    ws_host = q.get("host", [sni])[0]
    insecure = q.get("insecure", q.get("allowInsecure", ["0"]))[0] in ["1", "true"]

    outbound = {
        "type": "trojan", "tag": "proxy", "server": host, "server_port": int(port), "password": pwd,
        "tls": {"enabled": True, "server_name": sni, "insecure": insecure}
    }
    if net_type == "ws":
        outbound["transport"] = {"type": "ws", "path": unquote(path), "headers": {"Host": ws_host}}

elif node_url.startswith("vmess://"):
    b64_str = node_url[8:].strip()
    b64_str += "=" * (-len(b64_str) % 4)
    v_data = json.loads(base64.b64decode(b64_str).decode("utf-8"))
    host = v_data.get("add")
    port = int(v_data.get("port", 443))
    uuid = v_data.get("id")
    aid = int(v_data.get("aid", 0))
    scy = v_data.get("scy", "auto")
    net = v_data.get("net", "tcp")
    tls_str = v_data.get("tls", "")
    sni = v_data.get("sni", v_data.get("host", host))
    ws_host = v_data.get("host", sni)
    path = v_data.get("path", "/")
    insecure = str(v_data.get("insecure", "0")) in ["1", "true"]

    outbound = {
        "type": "vmess", "tag": "proxy", "server": host, "server_port": port,
        "uuid": uuid, "security": scy, "alter_id": aid
    }
    if tls_str == "tls":
        outbound["tls"] = {"enabled": True, "server_name": sni, "insecure": insecure}
    if net == "ws":
        outbound["transport"] = {"type": "ws", "path": unquote(path), "headers": {"Host": ws_host}}

elif node_url.startswith("hysteria2://") or node_url.startswith("hy2://"):
    u = urlparse(node_url)
    q = parse_qs(u.query)
    pwd = u.username
    host = u.hostname
    port = u.port or 443
    sni = q.get("sni", [host])[0]
    insecure = q.get("insecure", q.get("allowInsecure", ["0"]))[0] in ["1", "true"]

    outbound = {
        "type": "hysteria2", "tag": "proxy", "server": host, "server_port": int(port), "password": pwd,
        "tls": {"enabled": True, "server_name": sni, "insecure": insecure}
    }

config = {
    "inbounds": [{"type": "socks", "tag": "socks-in", "listen": "127.0.0.1", "listen_port": 10808}],
    "outbounds": [outbound]
}
with open("config.json", "w") as f:
    json.dump(config, f, indent=2)
print("✅ 节点配置转换成功！")
'

            echo "🚀 启动后台节点服务 (127.0.0.1:10808)..."
            ./sing-box run -c config.json &
            sleep 4
            
            echo "🌐 测试节点代理连接状态与出口 IP："
            curl -x socks5://127.0.0.1:10808 -s https://api.ipify.org || true
            echo ""
          fi

      # 2. 安装 Python 依赖与 Xvfb
      - name: Install dependencies & Xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install playwright requests
          playwright install chromium

      # 3. 运行 Python 自动化脚本
      - name: Run script with Xvfb
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          PROXY_URL: socks5://127.0.0.1:10808
        run: xvfb-run --auto-servernum python rustix.py

      # 4. 上传截图产物
      - name: Upload Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-screenshots
          path: '*.png'

      # 5. 清理历史记录
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
